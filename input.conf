##################################################
# mpv-config 按键表 —— 和 Fast Viewer 手感对齐
# 右键关、Esc 关、双击全屏；左右方向键逐帧（像看图翻页）
# 完整说明见 CURRENT.md
##################################################

##################################################
# 【基础功能】
##################################################
SPACE         cycle pause                # 空格：播放 / 暂停
ENTER         cycle window-maximized     # 回车：窗口最大化
KP_ENTER      cycle window-maximized     # 小键盘回车：窗口最大化
ESC           quit                       # Esc：关闭（和 Fast Viewer 一致）
q             quit                       # q：关闭

##################################################
# 【方向键】左右 = 逐帧（新），Shift+左右 = 5 秒，Ctrl+左右 = 1 秒
##################################################
LEFT          repeatable no-osd set pause yes; frame-back-step   # ←：上一帧（自动暂停，长按连发）
RIGHT         repeatable no-osd set pause yes; frame-step        # →：下一帧（自动暂停，长按连发）
Shift+LEFT    seek -5                    # Shift+←：后退 5 秒（原来的 ← 功能挪到这里）
Shift+RIGHT   seek 5                     # Shift+→：快进 5 秒
Ctrl+LEFT     seek -1 exact              # Ctrl+←：精退 1 秒
Ctrl+RIGHT    seek 1 exact               # Ctrl+→：精进 1 秒
UP            add volume 2               # ↑：音量 +2
DOWN          add volume -2              # ↓：音量 -2

##################################################
# 【小键盘】和旧配置一样
##################################################

# --- 小键盘 5：播放 / 暂停。暂停时进度条常亮（uosc 的 timeline_persistency=paused），播放时自动隐藏
#     等于旧配置的“分析模式 A / 纯净模式 B”，不用再切 osc 选项
KP5           cycle pause ; set osd-level 0
KP_BEGIN      cycle pause ; set osd-level 0

# --- 逐帧播放（长按连发）---
KP6           repeatable no-osd set pause yes; frame-step      # 小键盘 6：下一帧
KP_RIGHT      repeatable no-osd set pause yes; frame-step      # 小键盘 6（NumLock 关）
KP4           repeatable no-osd set pause yes; frame-back-step # 小键盘 4：上一帧
KP_LEFT       repeatable no-osd set pause yes; frame-back-step # 小键盘 4（NumLock 关）

# --- 倍速与精准跳转 ---
KP9           add speed 0.25             # 加速
KP7           add speed -0.25            # 减速
KP8           set speed 1.0              # 重置倍速
KP3           seek 1 exact               # 精进 1 秒
KP1           seek -1 exact              # 精退 1 秒

# --- 退出与控制 ---
KP_SUBTRACT   quit                       # 小键盘 -：关闭
KP_ADD        cycle pause                # 小键盘 +：播放 / 暂停

##################################################
# 【鼠标】
##################################################
MBTN_LEFT     cycle pause                # 左键单击：播放 / 暂停（点在进度条上则由 uosc 接管为跳转）
MBTN_LEFT_DBL cycle fullscreen           # 左键双击：全屏（和 Fast Viewer 一致）
MBTN_RIGHT    quit                       # 右键：关闭（和 Fast Viewer 一致）
MBTN_MID      script-binding uosc/toggle-progress   # 中键：切换底部那条“常显细进度线”

# 滚轮：下滚进一帧，上滚退一帧（鼠标停在进度条上时滚轮由 uosc 接管为按秒跳）
WHEEL_DOWN    repeatable no-osd set pause yes; frame-step
WHEEL_UP      repeatable no-osd set pause yes; frame-back-step

# 侧键
MBTN_BACK     seek -5                    # 侧键后退：后退 5 秒
MBTN_FORWARD  seek 5                     # 侧键前进：快进 5 秒

##################################################
# 【实用工具】
##################################################
i             script-binding stats/display-stats  # i：显示视频统计
Ctrl+s        screenshot                          # Ctrl+s：截图到桌面
f             cycle fullscreen                    # f：全屏
m             script-binding uosc/menu            # m：uosc 菜单（音轨 / 字幕 / 章节等）
