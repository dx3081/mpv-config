# mpv-config —— “QuickTime 式逐帧播放器”，速度第一
# 仓库：https://github.com/dx3081/mpv-config   现状页：CURRENT.md
# 两台机器通用（台式 RX 9070 XT / Win10；MSI 笔记本 RTX 3060 / Win11）。
# 原则：任何会拖慢“双击 → 出第一帧”的画质项都不要；逐帧和拖动要即时；闲置 CPU 接近 0。

##### 基础（沿用旧配置，不动）
input-default-bindings=no          # 只用 input.conf 里的按键
keep-open=yes                      # 播完停在最后一帧，不自动关
border=no                          # 无边框窗口（和 Fast Viewer 一样）
osd-level=1
autofit-smaller=900x600            # 小视频至少放大到 900x600 显示
autofit-larger=100%x100%           # 比屏幕大的视频（4K）缩到屏幕内

##### 界面：uosc 接管进度条/控制条，关掉 mpv 自带的 osc 和 osd 进度条（uosc 要求）
osc=no
osd-bar=no

##### 渲染与解码（速度优先）
vo=gpu-next
gpu-api=d3d11                      # 写死，不让它探测
gpu-context=d3d11
hwdec=d3d11va                      # 硬解直出（不拷回内存）。两台机器的显卡都支持 h264/hevc/vp9/av1
profile=fast                       # 关掉一切重着色器（和 high-quality 相反）
scale=spline36                     # fast 档默认是 bilinear，这里略提一档，GPU 开销可忽略
cscale=bilinear
dscale=mitchell
dither-depth=no                    # 不抖动，省一遍计算
video-sync=audio                   # 默认同步方式，不要 display-resample（它会拖慢起播并常驻算插帧）
# interpolation / deband / error-diffusion / hdr-compute-peak 全部不开

##### 逐帧 / 拖动手感
hr-seek=yes                        # 所有跳转精确到帧（拖进度条停哪帧就是哪帧）
hr-seek-framedrop=yes              # 跳转时解码器允许丢帧，拖动更跟手
demuxer-max-bytes=64MiB            # 本地文件够用；旧配置 500MiB 没必要
demuxer-max-back-bytes=64MiB       # 往回逐帧时不用重新读盘

##### 启动瘦身：不加载用不到的内置脚本
ytdl=no                            # 不看网络视频，不加载 ytdl_hook
load-auto-profiles=no
load-select=no
load-positioning=no
load-commands=no
load-console=yes                   # 留着 ` 控制台，排错用
load-stats-overlay=yes             # 留着 i 键看统计

##### 其它
cache=yes
save-position-on-quit=no
screenshot-directory=~~desktop/
screenshot-format=png
