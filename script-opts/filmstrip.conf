# filmstrip.lua（B 方案：iPhone 相册式胶片条）的选项
# 第一次用默认开哪个：yes = 胶片条（B），no = uosc 进度条（A）。按 Tab 切换后会记住，这项就不再管用
default_on=yes
# 一条里最多几张小图
thumbs=24
# 平时 / 悬停放大后的胶片条高度（像素）
strip_h=44
strip_h_hover=64
# 圆形按钮直径、左右边距、按钮和条的间距
button=36
pad=14
gap=12
# 时间字体
font=Segoe UI
# 按住拖条多久（毫秒）进放大镜模式
hold_ms=350
# 放大镜模式每帧占几像素（决定一屏几秒；30 帧视频在 1280 宽窗口约 6 秒，全屏约 14 秒）
fine_px_per_frame=6
# 放大镜模式一屏最多几秒
fine_span=15
# 条距窗口底边（像素）
bottom=10
